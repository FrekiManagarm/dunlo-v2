      <rect x="210" width="246" height="52" rx="26" fill="#FFFFFF" stroke="#CFE0D5"/>
      <circle cx="240" cy="26" r="8" fill="#00E87B"/>
      <text x="262" y="35" font-family="Outfit, Arial, sans-serif" font-size="19" font-weight="800" fill="#0D1210">Stripe-native recovery</text>
