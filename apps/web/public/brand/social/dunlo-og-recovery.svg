  <circle cx="1028" cy="128" r="96" fill="#FAFEFB"/>
  <path d="M83 586C246 564 400 564 546 586" stroke="#D4E5DB" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(78 76)">
