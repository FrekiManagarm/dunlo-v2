  <circle cx="1012" cy="148" r="188" fill="#D9F5E4"/>
  <circle cx="1012" cy="148" r="96" fill="#F8FCF9"/>
  <path d="M111 604C272 587 410 587 525 604" stroke="#DDECE3" stroke-width="2" stroke-linecap="round"/>

  <g transform="translate(76 76) scale(1.72)">
